services:

  php:
    build:
      context: ./docker/php
    container_name: magento_enterprise_php
    volumes:
      - ./src:/var/www/html
    networks:
      - magento

  nginx:
    image: nginx:latest
    container_name: magento_enterprise_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - magento

  mariadb:
    image: mariadb:11
    container_name: magento_enterprise_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - magento

  redis:
    image: redis:latest
    container_name: magento_enterprise_redis
    networks:
      - magento

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: magento_enterprise_opensearch
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9201:9200"
    networks:
      - magento

  rabbitmq:
    image: rabbitmq:3-management
    container_name: magento_enterprise_rabbitmq
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - magento

  mailhog:
    image: mailhog/mailhog
    container_name: magento_enterprise_mailhog
    ports:
      - "8025:8025"
    networks:
      - magento

networks:
  magento:
